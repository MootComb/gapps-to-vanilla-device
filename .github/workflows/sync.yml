name: Sync Vanilla for Project Infinity-X

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only discover and report, do not convert'
        type: boolean
        default: true
      device_filter:
        description: 'Comma-separated codenames (empty = all)'
        required: false
        default: ''
      force_rebuild:
        description: 'Ignore manifest, rebuild everything'
        type: boolean
        default: false
      prune_stale:
        description: 'Remove devices no longer present from the sync release'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  actions: write

env:
  SYNC_TAG: sync
  WORK_ROOT: /mnt/work
  EROFS_VERSION: v1.8.2
  APT_VERSION: "1.0"

jobs:
  # ============================================================
  # JOB 0: SETUP
  # Runs ONCE. Builds erofs-utils, downloads otaripper,
  # warms apt cache. Uploads binaries as artifacts so convert
  # jobs can just download them instead of rebuilding.
  # ============================================================
  setup:
    name: Setup build tools
    runs-on: ubuntu-22.04
    steps:
      - name: Install system dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            erofs-utils e2fsprogs android-sdk-libsparse-utils brotli zip unzip
            xz-utils attr acl p7zip-full curl wget jq file rsync
            build-essential liblz4-dev liblzma-dev libzstd-dev uuid-dev
            libselinux1-dev libfuse-dev pkg-config autoconf automake libtool
            python3 python3-pip
          version: ${{ env.APT_VERSION }}

      - name: Create staging directories
        run: |
          set -euo pipefail
          mkdir -p /tmp/setup/erofs-utils/bin
          mkdir -p /tmp/setup/erofs-utils/lib
          mkdir -p /tmp/setup/otaripper
          df -T /tmp

      - name: Build erofs-utils from source
        run: |
          set -euo pipefail
          SRC=/tmp/setup/erofs-utils-src
          git clone --depth=1 --branch "${EROFS_VERSION}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git "$SRC"
          cd "$SRC"
          ./autogen.sh
          ./configure --prefix=/tmp/setup/erofs-utils --enable-fuse
          make -j$(nproc)
          make install
          echo "=== Installed into /tmp/setup/erofs-utils ==="
          find /tmp/setup/erofs-utils -type f | head -50
          ls -la /tmp/setup/erofs-utils/bin/ || true
          ls -la /tmp/setup/erofs-utils/lib/ || true

      - name: Download otaripper
        run: |
          set -euo pipefail
          mkdir -p /tmp/setup/otaripper
          cd /tmp/setup

          URL=""
          if curl -fsSL --retry 3 --retry-delay 5 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: projectinfinity-sync/1.0" \
              https://api.github.com/repos/syedinsaf/otaripper/releases/latest \
              -o /tmp/setup/otaripper_api.json 2>/dev/null; then
            URL=$(jq -r '.assets[]? | select(.name | test("linux-static-x86_64.*\\.tar\\.gz$")) | .browser_download_url' \
              /tmp/setup/otaripper_api.json 2>/dev/null | head -1 || true)
            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              URL=$(jq -r '.assets[]? | select(.name | test("linux.*x86_64.*\\.tar\\.gz$")) | .browser_download_url' \
                /tmp/setup/otaripper_api.json 2>/dev/null | head -1 || true)
            fi
          fi

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "WARN: GitHub API failed, using fallback URL"
            URL="https://github.com/syedinsaf/otaripper/releases/latest/download/otaripper-linux-static-x86_64.tar.gz"
          fi

          echo "otaripper URL: $URL"

          if ! curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
              -o /tmp/setup/otaripper.tar.gz "$URL"; then
            echo "ERROR: failed to download otaripper from $URL"
            curl -sL https://api.github.com/repos/syedinsaf/otaripper/releases \
              | jq -r '.[].assets[].name' || true
            exit 1
          fi

          ls -lh /tmp/setup/otaripper.tar.gz
          file /tmp/setup/otaripper.tar.gz

          tar --no-same-owner --no-same-permissions -xzf /tmp/setup/otaripper.tar.gz -C /tmp/setup/otaripper || {
            echo "ERROR: failed to extract otaripper.tar.gz"
            tar -tzf /tmp/setup/otaripper.tar.gz | head -20 || true
            exit 1
          }

          BIN=$(find /tmp/setup/otaripper -maxdepth 3 -type f -name 'otaripper*' -executable | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find /tmp/setup/otaripper -maxdepth 3 -type f -name 'otaripper*' | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "ERROR: otaripper binary not found after extraction"
            find /tmp/setup/otaripper -type f | head -20
            exit 1
          fi

          echo "Found binary: $BIN"
          cp "$BIN" /tmp/setup/otaripper/otaripper
          chmod +x /tmp/setup/otaripper/otaripper
          /tmp/setup/otaripper/otaripper --version 2>&1 | head -3 || true

      - name: Verify setup binaries
        run: |
          set -euo pipefail
          echo "=== EROFS bin ==="
          ls -la /tmp/setup/erofs-utils/bin/
          /tmp/setup/erofs-utils/bin/mkfs.erofs 2>&1 | head -1 || true
          /tmp/setup/erofs-utils/bin/fsck.erofs 2>&1 | head -1 || true
          echo "=== EROFS lib ==="
          ls -la /tmp/setup/erofs-utils/lib/ || true
          echo "=== otaripper ==="
          ls -la /tmp/setup/otaripper/
          /tmp/setup/otaripper/otaripper --version 2>&1 | head -3 || true

      - name: Package erofs-utils
        run: |
          set -euo pipefail
          cd /tmp/setup
          tar -czf erofs-utils.tar.gz -C erofs-utils .
          ls -lh erofs-utils.tar.gz

      - name: Package otaripper
        run: |
          set -euo pipefail
          cd /tmp/setup
          tar -czf otaripper.tar.gz -C otaripper .
          ls -lh otaripper.tar.gz

      - name: Upload erofs-utils artifact
        uses: actions/upload-artifact@v4
        with:
          name: erofs-utils-bin
          path: /tmp/setup/erofs-utils.tar.gz
          retention-days: 7

      - name: Upload otaripper artifact
        uses: actions/upload-artifact@v4
        with:
          name: otaripper-bin
          path: /tmp/setup/otaripper.tar.gz
          retention-days: 7

  # ============================================================
  # JOB 1: DISCOVER
  # Scans official_devices repo (branches 17, 16, master).
  # Donor priority:
  #   1) external donor with SAME version
  #   2) own vanilla (even if version differs)
  #   3) external donor with closest timestamp (any version)
  # Builds report.json, matrix.json, stale.json.
  # ============================================================
  discover:
    name: Discover devices
    needs: [setup]
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}
      has_jobs: ${{ steps.scan.outputs.has_jobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch existing sync release manifest
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p existing
          if gh release view "$SYNC_TAG" --repo "$REPO" &>/dev/null; then
            echo "Release '$SYNC_TAG' exists"
            gh release view "$SYNC_TAG" --repo "$REPO" --json assets \
              -q '.assets[].name' > existing/assets.txt
            echo "Existing assets:"
            cat existing/assets.txt || true
            if grep -qx 'manifest.json' existing/assets.txt; then
              gh release download "$SYNC_TAG" --repo "$REPO" \
                --pattern 'manifest.json' --dir existing
              echo "has_manifest=true" >> $GITHUB_OUTPUT
            else
              echo "has_manifest=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Release '$SYNC_TAG' does not exist yet"
            touch existing/assets.txt
            echo "has_manifest=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan official_devices and build matrix
        id: scan
        env:
          FILTER: ${{ inputs.device_filter }}
          FORCE: ${{ inputs.force_rebuild }}
          PRUNE: ${{ inputs.prune_stale }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out

          python3 - <<'PY' > out/report.json
          import json, os, re, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          UA = {"User-Agent": "Mozilla/5.0 projectinfinity-sync/1.0"}
          REPO = "ProjectInfinity-X/official_devices"
          BRANCHES = ["17", "16", "master"]
          API_CONTENTS = f"https://api.github.com/repos/{REPO}/contents/devices?ref={{branch}}"
          RAW = "https://raw.githubusercontent.com/{repo}/{branch}/"

          def fetch_json(url):
              try:
                  with urlopen(Request(url, headers=UA), timeout=60) as r:
                      return json.loads(r.read())
              except HTTPError:
                  return None
              except Exception:
                  return None

          def list_devices():
              seen = {}
              for br in BRANCHES:
                  data = fetch_json(API_CONTENTS.format(branch=br))
                  if not data:
                      continue
                  for f in data:
                      name = f.get("name", "")
                      if name.endswith(".json"):
                          cn = name[:-5]
                          if cn not in seen:
                              seen[cn] = br
              return seen

          def build_info(branch, kind, codename):
              data = fetch_json(RAW.format(repo=REPO, branch=branch) + f"{kind}/{codename}.json")
              if not data:
                  return None
              resp = data.get("response")
              if isinstance(resp, list) and resp:
                  return resp[0]
              return None

          def device_info(branch, codename):
              data = fetch_json(RAW.format(repo=REPO, branch=branch) + f"devices/{codename}.json")
              return data or {}

          def norm_version(v):
              return str(v).strip() if v else ""

          def version_tuple(v):
              if not v:
                  return ()
              return tuple(int(x) for x in re.findall(r"\d+", str(v)))

          def ts_human(ts):
              if not ts:
                  return "-"
              try:
                  return datetime.fromtimestamp(int(ts), tz=timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              except Exception:
                  return str(ts)

          def ts_from_filename(fn):
              if not fn:
                  return ""
              m = re.search(r"(\d{2})\.(\d{2})\.(\d{4})", fn)
              return f"{m.group(3)}-{m.group(2)}-{m.group(1)}" if m else ""

          devices = list_devices()
          filt = set(x.strip() for x in os.environ.get("FILTER", "").split(",") if x.strip())
          force = os.environ.get("FORCE", "false") == "true"

          all_info = {}
          for cn, branch in sorted(devices.items()):
              g = build_info(branch, "gapps", cn)
              v = build_info(branch, "vanilla", cn)
              di = device_info(branch, cn)
              all_info[cn] = {
                  "codename": cn,
                  "devicemodel": di.get("devicemodel", "") or cn,
                  "maintainer": di.get("maintainer", ""),
                  "branch": branch,
                  "gapps": g,
                  "vanilla": v,
              }

          donors_by_version = {}
          for cn, info in all_info.items():
              v = info["vanilla"]
              if not v:
                  continue
              vt = version_tuple(v.get("version"))
              if not vt:
                  continue
              donors_by_version.setdefault(vt, []).append({
                  "codename": cn,
                  "devicemodel": info["devicemodel"],
                  "version": norm_version(v.get("version")),
                  "timestamp": int(v.get("timestamp") or 0),
                  "download": v.get("download", ""),
                  "filename": v.get("filename", ""),
              })

          report = []
          matrix = []
          stale = []

          existing_manifest = {}
          if not force and os.path.isfile("existing/manifest.json"):
              try:
                  existing_manifest = json.load(open("existing/manifest.json")).get("devices", {})
              except Exception:
                  existing_manifest = {}

          for cn, info in all_info.items():
              if filt and cn not in filt:
                  continue

              g = info["gapps"]
              v = info["vanilla"]
              devicemodel = info["devicemodel"]
              branch = info["branch"]

              entry = {
                  "codename": cn,
                  "devicemodel": devicemodel,
                  "maintainer": info["maintainer"],
                  "branch": branch,
                  "gapps": {
                      "exists": bool(g),
                      "version": norm_version(g.get("version")) if g else "",
                      "timestamp": int(g.get("timestamp") or 0) if g else 0,
                      "date": ts_human(g.get("timestamp") if g else None),
                      "filename": (g or {}).get("filename", ""),
                      "download": (g or {}).get("download", ""),
                      "md5": (g or {}).get("md5", ""),
                      "size": int((g or {}).get("size") or 0) if g else 0,
                  },
                  "vanilla": {
                      "exists": bool(v),
                      "version": norm_version(v.get("version")) if v else "",
                      "timestamp": int(v.get("timestamp") or 0) if v else 0,
                      "date": ts_human(v.get("timestamp") if v else None),
                      "filename": (v or {}).get("filename", ""),
                      "download": (v or {}).get("download", ""),
                      "md5": (v or {}).get("md5", ""),
                      "size": int((v or {}).get("size") or 0) if v else 0,
                  },
                  "donor": None,
                  "publish": False,
                  "action": "skip",
                  "reason": "",
              }

              if not g:
                  entry["reason"] = "no gapps build"
                  report.append(entry)
                  continue

              if v and norm_version(g.get("version")) == norm_version(v.get("version")):
                  entry["reason"] = f"vanilla exists with same version {norm_version(v.get('version'))}"
                  entry["publish"] = False
                  entry["action"] = "skip"
                  report.append(entry)
                  continue

              target_ver = version_tuple(g.get("version"))
              target_ts = int(g.get("timestamp") or 0)

              candidates_l1 = []
              if target_ver in donors_by_version:
                  for d in donors_by_version[target_ver]:
                      if d["codename"] == cn:
                          continue
                      candidates_l1.append(d)

              chosen = None
              level = None

              if candidates_l1:
                  candidates_l1.sort(key=lambda d: abs(d["timestamp"] - target_ts))
                  chosen = candidates_l1[0]
                  level = 1
              elif v:
                  chosen = {
                      "codename": cn,
                      "devicemodel": devicemodel,
                      "version": norm_version(v.get("version")),
                      "timestamp": int(v.get("timestamp") or 0),
                      "download": v.get("download", ""),
                      "filename": v.get("filename", ""),
                  }
                  level = 2
              else:
                  all_donors = []
                  for dlist in donors_by_version.values():
                      for d in dlist:
                          if d["codename"] == cn:
                              continue
                          all_donors.append(d)
                  if all_donors:
                      all_donors.sort(key=lambda d: abs(d["timestamp"] - target_ts))
                      chosen = all_donors[0]
                      level = 3

              if not chosen:
                  entry["reason"] = "no vanilla and no donor available"
                  entry["publish"] = False
                  entry["action"] = "skip"
                  report.append(entry)
                  continue

              if level == 2:
                  entry["donor"] = {
                      "codename": cn,
                      "devicemodel": devicemodel,
                      "version": chosen["version"],
                      "timestamp": chosen["timestamp"],
                      "filename": chosen["filename"],
                      "level": 2,
                  }
                  entry["reason"] = (
                      f"vanilla exists with different version "
                      f"(gapps={norm_version(g.get('version'))}, "
                      f"vanilla={chosen['version']}), using own vanilla (level 2)"
                  )
              else:
                  entry["donor"] = {
                      "codename": chosen["codename"],
                      "devicemodel": chosen["devicemodel"],
                      "version": chosen["version"],
                      "timestamp": chosen["timestamp"],
                      "filename": chosen["filename"],
                      "level": level,
                  }
                  if level == 1:
                      entry["reason"] = (
                          f"no vanilla for target, using external donor "
                          f"{chosen['codename']} (v{chosen['version']}, level 1)"
                      )
                  else:
                      entry["reason"] = (
                          f"no vanilla and no donor with same version, using closest donor "
                          f"{chosen['codename']} (v{chosen['version']}, level 3)"
                      )

              entry["action"] = "update" if v else "new"
              entry["publish"] = True
              vanilla_url = chosen["download"]
              vanilla_filename = chosen["filename"]
              vanilla_timestamp = chosen["timestamp"]

              old = existing_manifest.get(cn)
              if old and not force:
                  old_donor = old.get("donor_codename") or ""
                  new_donor = entry["donor"]["codename"] if entry["donor"] else ""
                  same = (
                      old.get("gapps_md5") == entry["gapps"]["md5"]
                      and old.get("version") == entry["gapps"]["version"]
                      and old_donor == new_donor
                      and old.get("build_status") == "ok"
                  )
                  if same:
                      entry["publish"] = False
                      entry["action"] = "skip"
                      entry["reason"] = "unchanged since last sync"
                      report.append(entry)
                      continue
                  else:
                      entry["action"] = "update"
                      entry["reason"] = (
                          f"changed: version {old.get('version')}->{entry['gapps']['version']}, "
                          f"donor {old_donor or 'self'}->{new_donor or 'self'}"
                      )

              entry["publish"] = True
              report.append(entry)

              version = entry["gapps"]["version"]
              date_tag = ts_from_filename(entry["gapps"]["filename"])
              matrix.append({
                  "codename": cn,
                  "devicemodel": devicemodel,
                  "branch": branch,
                  "version": version,
                  "date_tag": date_tag,
                  "release_tag": f"{cn}-vanilla-{version}-{date_tag}".rstrip("-"),
                  "gapps_url": entry["gapps"]["download"],
                  "vanilla_url": vanilla_url,
                  "gapps_timestamp": entry["gapps"]["timestamp"],
                  "vanilla_timestamp": vanilla_timestamp,
                  "gapps_filename": entry["gapps"]["filename"],
                  "vanilla_filename": vanilla_filename,
                  "gapps_md5": entry["gapps"]["md5"],
                  "donor_codename": entry["donor"]["codename"] if entry["donor"] else "",
                  "donor_devicemodel": entry["donor"]["devicemodel"] if entry["donor"] else "",
                  "donor_level": entry["donor"]["level"] if entry["donor"] else 0,
                  "reason": entry["reason"],
              })

          for cn in existing_manifest:
              if cn not in [r["codename"] for r in report]:
                  stale.append(cn)

          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

          jq '[.[] | select(.publish == true)]' out/report.json > out/matrix.json
          jq '[.[] | select(.publish == false)]' out/report.json > out/skipped.json

          if [ -f existing/manifest.json ]; then
            jq -r '.devices | keys[]' existing/manifest.json > /tmp/old_codenames.txt
            jq -r '.[].codename' out/report.json > /tmp/new_codenames.txt
            comm -23 <(sort /tmp/old_codenames.txt) <(sort /tmp/new_codenames.txt) > out/stale.json.raw
            jq -R -s 'split("\n") | map(select(length > 0))' out/stale.json.raw > out/stale.json
          else
            echo '[]' > out/stale.json
          fi

          python3 - <<'PY' > out/report.md
          import json
          from datetime import datetime, timezone

          report = json.load(open("out/report.json"))
          stale = json.load(open("out/stale.json"))

          publish = [r for r in report if r["publish"]]
          skipped = [r for r in report if not r["publish"]]

          print("# Project Infinity-X — Vanilla sync report")
          print()
          print(f"Generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}")
          print()
          print("## Summary")
          print()
          print(f"- Total devices: **{len(report)}**")
          print(f"- Will publish (convert): **{len(publish)}**")
          print(f"- Skipped: **{len(skipped)}**")
          print(f"- Stale (no longer present): **{len(stale)}**")
          print()
          print("## Devices to publish")
          print()
          print("| # | Model | Codename | Branch | GApps ver | Vanilla ver | Donor | Level | Reason |")
          print("|---|---|---|---|---|---|---|---|---|")
          for i, r in enumerate(publish, 1):
              donor = r["donor"]["codename"] if r.get("donor") else "-"
              lvl = r["donor"]["level"] if r.get("donor") else "-"
              print(f"| {i} | {r['devicemodel']} | `{r['codename']}` | {r['branch']} | "
                    f"{r['gapps']['version'] or '-'} | {r['vanilla']['version'] or '-'} | "
                    f"{donor} | {lvl} | {r['reason']} |")
          print()
          print("## Devices skipped")
          print()
          print("| # | Model | Codename | Branch | GApps ver | Vanilla ver | Reason |")
          print("|---|---|---|---|---|---|---|")
          for i, r in enumerate(skipped, 1):
              print(f"| {i} | {r['devicemodel']} | `{r['codename']}` | {r['branch']} | "
                    f"{r['gapps']['version'] or '-'} | {r['vanilla']['version'] or '-'} | {r['reason']} |")
          if stale:
              print()
              print("## Stale devices (not in current scan)")
              print()
              for cn in stale:
                  print(f"- `{cn}`")
          PY

          COUNT=$(jq 'length' out/matrix.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            MATRIX_JSON=$(jq -c '.' out/matrix.json | tr -d '\n')
            printf 'matrix=%s\n' "$MATRIX_JSON" >> "$GITHUB_OUTPUT"
            echo "has_jobs=true" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_jobs=false" >> $GITHUB_OUTPUT
          fi

          echo "=== Matrix JSON (raw) ==="
          cat out/matrix.json | jq '.'

          echo "=== Summary (first 80) ==="
          jq -r '.[0:80] | .[] | "[\(.action)] \(.devicemodel) (\(.codename)): \(.reason)"' out/report.json || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            out/report.json
            out/report.md
            out/matrix.json
            out/skipped.json
            out/stale.json
          retention-days: 30

      - name: Print report to summary
        run: |
          {
            echo "## Discovery complete"
            echo ""
            cat out/report.md
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: CONVERT
  # Downloads pre-built erofs-utils and otaripper from setup
  # artifacts. Installs apt packages (cached). Reads matrix.json
  # from the report artifact to get exact per-device fields.
  # ============================================================
  convert:
    name: Convert ${{ matrix.codename }}
    needs: [setup, discover]
    if: |
      !inputs.dry_run
      && needs.discover.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download report (matrix.json)
        uses: actions/download-artifact@v4
        with:
          name: report
          path: /tmp/report

      - name: Export matrix to env
        run: |
          set -euo pipefail
          CN="${{ matrix.codename }}"
          echo "CN=$CN" >> $GITHUB_ENV
          echo "WORK_ROOT=/mnt/work" >> $GITHUB_ENV

          if [ ! -f /tmp/report/matrix.json ]; then
            echo "ERROR: /tmp/report/matrix.json not found"
            ls -la /tmp/report || true
            exit 1
          fi

          ITEM=$(jq -c --arg cn "$CN" '.[] | select(.codename == $cn)' /tmp/report/matrix.json | head -1)
          if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
            echo "ERROR: matrix entry not found for $CN"
            echo "Available codenames:"
            jq -r '.[].codename' /tmp/report/matrix.json || true
            exit 1
          fi

          MODEL_VAL=$(echo "$ITEM" | jq -r '.devicemodel // ""')
          VER_VAL=$(echo "$ITEM" | jq -r '.version // ""')
          GAPPS_VAL=$(echo "$ITEM" | jq -r '.gapps_url // ""')
          VANILLA_VAL=$(echo "$ITEM" | jq -r '.vanilla_url // ""')
          DONOR_VAL=$(echo "$ITEM" | jq -r '.donor_codename // ""')
          LEVEL_VAL=$(echo "$ITEM" | jq -r '.donor_level // 0')

          {
            echo "MODEL=$MODEL_VAL"
            echo "VER=$VER_VAL"
            echo "GAPPS_URL=$GAPPS_VAL"
            echo "VANILLA_URL=$VANILLA_VAL"
            echo "DONOR=$DONOR_VAL"
            echo "DONOR_LEVEL=$LEVEL_VAL"
          } >> $GITHUB_ENV

          echo "=== Exported for $CN ==="
          echo "MODEL=$MODEL_VAL"
          echo "VER=$VER_VAL"
          echo "DONOR=$DONOR_VAL (level $LEVEL_VAL)"
          echo "GAPPS_URL=$GAPPS_VAL"
          echo "VANILLA_URL=$VANILLA_VAL"

          if [ -z "$GAPPS_VAL" ]; then
            echo "ERROR: empty GAPPS_URL for $CN (from matrix.json)"
            exit 1
          fi
          if [ -z "$VANILLA_VAL" ]; then
            echo "ERROR: empty VANILLA_URL for $CN (from matrix.json)"
            exit 1
          fi

      - name: Install system dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            erofs-utils e2fsprogs android-sdk-libsparse-utils brotli zip unzip
            xz-utils attr acl p7zip-full curl wget jq file rsync
            build-essential liblz4-dev liblzma-dev libzstd-dev uuid-dev
            libselinux1-dev libfuse-dev pkg-config autoconf automake libtool
            python3 python3-pip
          version: ${{ env.APT_VERSION }}

      - name: Download erofs-utils artifact from setup
        uses: actions/download-artifact@v4
        with:
          name: erofs-utils-bin
          path: /tmp/erofs-utils

      - name: Install erofs-utils from artifact
        run: |
          set -euo pipefail
          tar -xzf /tmp/erofs-utils/erofs-utils.tar.gz -C /tmp/erofs-utils/
          ls -la /tmp/erofs-utils/bin/ || true
          sudo cp /tmp/erofs-utils/bin/* /usr/local/bin/ 2>/dev/null || true
          sudo chmod +x /usr/local/bin/mkfs.erofs /usr/local/bin/fsck.erofs \
                        /usr/local/bin/dump.erofs /usr/local/bin/extract.erofs 2>/dev/null || true
          if [ -d /tmp/erofs-utils/lib ]; then
            sudo cp -a /tmp/erofs-utils/lib/. /usr/local/lib/ 2>/dev/null || true
          fi
          sudo ldconfig || true
          echo "=== Verify erofs-utils ==="
          which mkfs.erofs fsck.erofs dump.erofs extract.erofs || true
          mkfs.erofs 2>&1 | head -1 || true
          fsck.erofs 2>&1 | head -1 || true
          dump.erofs 2>&1 | head -1 || true

      - name: Download otaripper artifact from setup
        uses: actions/download-artifact@v4
        with:
          name: otaripper-bin
          path: /tmp/otaripper

      - name: Install otaripper from artifact
        run: |
          set -euo pipefail
          tar -xzf /tmp/otaripper/otaripper.tar.gz -C /tmp/otaripper/
          ls -la /tmp/otaripper/ || true
          BIN=/tmp/otaripper/otaripper
          if [ ! -f "$BIN" ]; then
            BIN=$(find /tmp/otaripper -maxdepth 2 -type f -name 'otaripper*' -executable | head -1)
          fi
          echo "Using otaripper: $BIN"
          sudo cp "$BIN" /usr/local/bin/otaripper
          sudo chmod +x /usr/local/bin/otaripper
          echo "=== Verify otaripper ==="
          which otaripper || true
          otaripper --version 2>&1 | head -3 || true

      - name: Create working directories
        run: |
          set -euo pipefail
          sudo mkdir -p "$WORK_ROOT"
          sudo chown $USER:$USER "$WORK_ROOT"
          mkdir -p "$WORK_ROOT/gapps" "$WORK_ROOT/vanilla" "$WORK_ROOT/work" \
                   "$WORK_ROOT/otaripper" "$WORK_ROOT/erofs-utils-src" "$WORK_ROOT/tmp"
          df -T "$WORK_ROOT"

      - name: Download GApps firmware
        run: |
          echo "GApps: $GAPPS_URL"
          curl -L --retry 5 --retry-delay 5 --retry-connrefused \
            -o "$WORK_ROOT/gapps/image" "$GAPPS_URL"
          ls -lh "$WORK_ROOT/gapps/image"

      - name: Download Vanilla firmware
        run: |
          echo "Vanilla: $VANILLA_URL"
          curl -L --retry 5 --retry-delay 5 --retry-connrefused \
            -o "$WORK_ROOT/vanilla/image" "$VANILLA_URL"
          ls -lh "$WORK_ROOT/vanilla/image"

      - name: Extract GApps archive and payload.bin
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/gapps"
          mkdir -p extracted

          if unzip -o image -d extracted >/dev/null 2>&1; then
            echo "GApps: unzip OK"
          elif xz -dk image 2>/dev/null; then
            echo "GApps: xz OK"
            [ -f image ] && mv image extracted/system.img
          else
            echo "GApps: raw image, treating as system.img"
            mv image extracted/system.img
          fi

          if [ -f extracted/payload.bin ]; then
            echo "GApps: payload.bin detected, extracting with otaripper"
            mkdir -p extracted/images
            otaripper extracted/payload.bin -o extracted/images -p system,system_ext,product || {
              otaripper extracted/payload.bin -o extracted/images || true
            }
            ls -lh extracted/images/ || true
            find extracted/images -maxdepth 2 -name "system.img" -exec mv {} extracted/ \;
            find extracted/images -maxdepth 2 -name "system_ext.img" -exec mv {} extracted/ \;
            find extracted/images -maxdepth 2 -name "product.img" -exec mv {} extracted/ \;
          fi

          if find extracted -maxdepth 1 -name '*.new.dat.br' -print -quit | grep -q .; then
            echo "GApps: block-based OTA detected"
            sudo apt-get install -y brotli python3-pip >/dev/null
            pip3 install --quiet --break-system-packages sdat2img || \
              pip3 install --quiet sdat2img || true
            SDAT2IMG=$(command -v sdat2img || command -v sdat2img.py || true)
            if [ -z "$SDAT2IMG" ]; then
              curl -fsSL -o "$WORK_ROOT/tmp/sdat2img.py" \
                https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
              chmod +x "$WORK_ROOT/tmp/sdat2img.py"
              SDAT2IMG="$WORK_ROOT/tmp/sdat2img.py"
            fi
            for part in system system_ext product vendor; do
              local_br="extracted/${part}.new.dat.br"
              local_dat="extracted/${part}.new.dat"
              local_tl="extracted/${part}.transfer.list"
              local_img="extracted/${part}.img"
              if [ -f "$local_br" ] && [ -f "$local_tl" ]; then
                echo "  Decoding ${part}.new.dat.br -> ${part}.new.dat"
                brotli -d -f -o "$local_dat" "$local_br"
                echo "  Converting ${part}.new.dat + ${part}.transfer.list -> ${part}.img"
                python3 "$SDAT2IMG" "$local_tl" "$local_dat" "$local_img" 2>/dev/null || \
                  "$SDAT2IMG" "$local_tl" "$local_dat" "$local_img"
                rm -f "$local_dat"
                ls -lh "$local_img"
              else
                echo "  skip ${part}: ${local_br} or ${local_tl} missing"
              fi
            done
          fi

          echo "=== GApps extracted ==="
          ls -lh extracted/

      - name: Extract Vanilla archive and payload.bin
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/vanilla"
          mkdir -p extracted

          if unzip -o image -d extracted >/dev/null 2>&1; then
            echo "Vanilla: unzip OK"
          elif xz -dk image 2>/dev/null; then
            echo "Vanilla: xz OK"
            [ -f image ] && mv image extracted/system.img
          else
            echo "Vanilla: raw image, treating as system.img"
            mv image extracted/system.img
          fi

          if [ -f extracted/payload.bin ]; then
            echo "Vanilla: payload.bin detected, extracting with otaripper"
            mkdir -p extracted/images
            otaripper extracted/payload.bin -o extracted/images -p system,system_ext,product || {
              otaripper extracted/payload.bin -o extracted/images || true
            }
            ls -lh extracted/images/ || true
            find extracted/images -maxdepth 2 -name "system.img" -exec mv {} extracted/ \;
            find extracted/images -maxdepth 2 -name "system_ext.img" -exec mv {} extracted/ \;
            find extracted/images -maxdepth 2 -name "product.img" -exec mv {} extracted/ \;
          fi

          if find extracted -maxdepth 1 -name '*.new.dat.br' -print -quit | grep -q .; then
            echo "Vanilla: block-based OTA detected"
            sudo apt-get install -y brotli python3-pip >/dev/null
            pip3 install --quiet --break-system-packages sdat2img || \
              pip3 install --quiet sdat2img || true
            SDAT2IMG=$(command -v sdat2img || command -v sdat2img.py || true)
            if [ -z "$SDAT2IMG" ]; then
              curl -fsSL -o "$WORK_ROOT/tmp/sdat2img.py" \
                https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
              chmod +x "$WORK_ROOT/tmp/sdat2img.py"
              SDAT2IMG="$WORK_ROOT/tmp/sdat2img.py"
            fi
            for part in system system_ext product vendor; do
              local_br="extracted/${part}.new.dat.br"
              local_dat="extracted/${part}.new.dat"
              local_tl="extracted/${part}.transfer.list"
              local_img="extracted/${part}.img"
              if [ -f "$local_br" ] && [ -f "$local_tl" ]; then
                echo "  Decoding ${part}.new.dat.br -> ${part}.new.dat"
                brotli -d -f -o "$local_dat" "$local_br"
                echo "  Converting ${part}.new.dat + ${part}.transfer.list -> ${part}.img"
                python3 "$SDAT2IMG" "$local_tl" "$local_dat" "$local_img" 2>/dev/null || \
                  "$SDAT2IMG" "$local_tl" "$local_dat" "$local_img"
                rm -f "$local_dat"
                ls -lh "$local_img"
              else
                echo "  skip ${part}: ${local_br} or ${local_tl} missing"
              fi
            done
          fi

          echo "=== Vanilla extracted ==="
          ls -lh extracted/

      - name: Auto-detect image formats and extract partitions
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/work"

          extract_image() {
            local img="$1"
            local out="$2"
            mkdir -p "$out"
            echo "  Image: $img"

            if fsck.erofs --extract="$out" --xattrs --preserve "$img" >/dev/null 2>&1; then
              echo "  OK: fsck.erofs --extract --xattrs --preserve"
              return 0
            fi
            if command -v extract.erofs >/dev/null 2>&1; then
              if extract.erofs -x -i "$img" -o "$out" >/dev/null 2>&1; then
                echo "  OK: extract.erofs -x"
                return 0
              fi
            fi
            local mnt="$WORK_ROOT/tmp/mnt_$$"
            rm -rf "$mnt"; mkdir -p "$mnt"
            if sudo mount -o loop,ro "$img" "$mnt" >/dev/null 2>&1; then
              echo "  OK: mount loop (copying contents then unmounting)"
              sudo rsync -aHAX --numeric-ids --exclude=lost+found "$mnt"/ "$out"/ || \
                sudo cp -a "$mnt"/. "$out"/
              sudo umount "$mnt" || sudo umount -l "$mnt" || true
              sudo chown -R $USER:$USER "$out" || true
              rm -rf "$mnt"
              return 0
            fi
            rm -rf "$mnt"
            if command -v debugfs >/dev/null 2>&1; then
              if debugfs -R "rdump / $out" "$img" >/dev/null 2>&1; then
                echo "  OK: debugfs rdump (ext4)"
                sudo chown -R $USER:$USER "$out" || true
                return 0
              fi
            fi
            if simg2img "$img" "${img}.raw" >/dev/null 2>&1; then
              echo "  OK: sparse -> simg2img"
              extract_image "${img}.raw" "$out"
              return $?
            fi
            echo "  ERROR: unable to extract $img"
            return 1
          }

          find_part_img() {
            local side="$1" part="$2"
            find "$WORK_ROOT/$side/extracted" -type f \
              \( -name "${part}.img" -o -name "${part}_a.img" -o -name "${part}_b.img" \) \
              2>/dev/null | head -1
          }

          dump_extracted() {
            local side="$1"
            echo ""
            echo "=== ls -lR $WORK_ROOT/$side/extracted ==="
            if [ -d "$WORK_ROOT/$side/extracted" ]; then
              ls -lR "$WORK_ROOT/$side/extracted" || true
            else
              echo "DIRECTORY DOES NOT EXIST: $WORK_ROOT/$side/extracted"
            fi
            echo "=== end $side ==="
            echo ""
          }

          FAIL=0

          echo "=== Extracting GApps partitions ==="
          dump_extracted gapps
          for part in system system_ext product; do
            img=$(find_part_img gapps "$part")
            if [ -n "$img" ]; then
              echo "GApps ${part}: $img"
              extract_image "$img" "gapps_${part}_raw" || { echo "ERROR: extract failed for gapps/${part}"; FAIL=1; }
            else
              echo "ERROR: GApps ${part}.img not found under $WORK_ROOT/gapps/extracted"
              FAIL=1
            fi
          done

          echo "=== Extracting Vanilla partitions (donor: ${DONOR:-self}, level ${DONOR_LEVEL:-?}) ==="
          dump_extracted vanilla
          for part in system system_ext product; do
            img=$(find_part_img vanilla "$part")
            if [ -n "$img" ]; then
              echo "Vanilla ${part}: $img"
              extract_image "$img" "vanilla_${part}_raw" || { echo "ERROR: extract failed for vanilla/${part}"; FAIL=1; }
            else
              echo "ERROR: Vanilla ${part}.img not found under $WORK_ROOT/vanilla/extracted"
              FAIL=1
            fi
          done

          echo "=== Extraction complete ==="
          ls -la

          if [ "$FAIL" -ne 0 ]; then
            echo "FATAL: one or more partitions missing. Aborting."
            exit 1
          fi

      - name: Log source image sizes (before)
        run: |
          set -e
          cd "$WORK_ROOT/work"

          echo "=== Source .img sizes (before modification) ===" | tee sizes_before.txt
          for side in gapps vanilla; do
            for part in system system_ext product; do
              img=$(find "$WORK_ROOT/$side/extracted" -maxdepth 2 -name "${part}.img" 2>/dev/null | head -1)
              if [ -n "$img" ] && [ -f "$img" ]; then
                RAW=$(stat -c %s "$img")
                SPARSE=$(file -b "$img" | grep -qi "Android sparse" && echo "yes" || echo "no")
                PACKED=$(du -sh "$img" | awk '{print $1}')
                printf '%-7s %-11s %12s bytes  du=%s  sparse=%s  %s\n' \
                  "$side" "$part" "$RAW" "$PACKED" "$SPARSE" "$img" | tee -a sizes_before.txt
              else
                printf '%-7s %-11s MISSING\n' "$side" "$part" | tee -a sizes_before.txt
              fi
            done
          done

          echo "" | tee -a sizes_before.txt
          echo "=== Extracted raw tree sizes (on-disk, after fsck.erofs) ===" | tee -a sizes_before.txt
          for side in gapps vanilla; do
            for part in system system_ext product; do
              d="${side}_${part}_raw"
              [ -d "$d" ] || continue
              FILES=$(find "$d" -type f | wc -l)
              LINKS=$(find "$d" -type l | wc -l)
              DIRS=$(find "$d" -type d | wc -l)
              BYTES=$(du -sb "$d" | awk '{print $1}')
              printf '%-7s %-11s files=%-7s links=%-5s dirs=%-6s bytes=%s\n' \
                "$side" "$part" "$FILES" "$LINKS" "$DIRS" "$BYTES" | tee -a sizes_before.txt
            done
          done

      - name: Compute and apply GApps to Vanilla diff (AOSP replacement)
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/work"

          MISSING=0
          for part in system system_ext product; do
            [ -d "gapps_${part}_raw" ]   || { echo "ERROR: gapps_${part}_raw missing";   MISSING=1; }
            [ -d "vanilla_${part}_raw" ] || { echo "ERROR: vanilla_${part}_raw missing"; MISSING=1; }
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: raw trees incomplete. Refusing to ship GApps-as-Vanilla."
            exit 1
          fi

          is_protected() {
            local rel="$1"
            case "$rel" in
              build.prop) return 0 ;;
              */build.prop) return 0 ;;
            esac
            return 1
          }

          is_apex_path() {
            case "$1" in
              apex/*|*/apex/*) return 0 ;;
            esac
            return 1
          }

          materialize_apex() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "$dst")"
            case "$src" in
              *.capex)
                local tmp="$WORK_ROOT/tmp/capex_$$"
                rm -rf "$tmp"; mkdir -p "$tmp"
                if unzip -o "$src" -d "$tmp" >/dev/null 2>&1 && [ -f "$tmp/original_apex" ]; then
                  cp -a "$tmp/original_apex" "$dst"
                else
                  echo "  WARN: cannot materialize $src (no original_apex)"
                  rm -rf "$tmp"
                  return 1
                fi
                rm -rf "$tmp"
                ;;
              *)
                cp -a "$src" "$dst"
                ;;
            esac
          }

          copy_preserve_xattr() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "$dst")"
            if [ ! -r "$src" ]; then
              echo "  WARN: unreadable $src, trying sudo cp"
              sudo cp -a --preserve=all "$src" "$dst" 2>/dev/null || { echo "  ERROR: cannot copy $src"; return 1; }
              sudo chown $USER:$USER "$dst" || true
            else
              cp -a --preserve=all "$src" "$dst" 2>/dev/null || cp -a "$src" "$dst"
            fi
            if command -v setfattr >/dev/null 2>&1; then
              if ! getfattr -n security.selinux "$dst" >/dev/null 2>&1; then
                setfattr -n security.selinux -v "u:object_r:system_file:s0" "$dst" 2>/dev/null || true
              fi
            fi
          }

          file_sig() {
            local f="$1"
            local sz
            sz=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -lt 67108864 ]; then
              sha256sum "$f" 2>/dev/null | awk '{print "sha256:"$1}'
            else
              stat -c "size:%s:mtime:%Y" "$f" 2>/dev/null
            fi
          }

          build_manifest() {
            local root="$1" out="$2"
            : > "$out"
            [ -d "$root" ] || return 0
            ( cd "$root" && find . -mindepth 1 \
                -not -path './lost+found' -not -path './lost+found/*' \
                \( -type f -o -type l -o -type d \) -print0 ) \
              | while IFS= read -r -d '' p; do
                  rel="${p#./}"
                  if [ -L "$root/$rel" ]; then
                    printf 'L\t%s\t%s\n' "$rel" "$(readlink "$root/$rel")"
                  elif [ -f "$root/$rel" ]; then
                    printf 'F\t%s\t%s\n' "$rel" "$(file_sig "$root/$rel")"
                  elif [ -d "$root/$rel" ]; then
                    printf 'D\t%s\t-\n' "$rel"
                  fi
                done >> "$out"
            sort -t $'\t' -k2,2 "$out" -o "$out"
          }

          size_of() {
            local p="$1"
            if [ -L "$p" ]; then
              printf 'link'
            elif [ -f "$p" ]; then
              stat -c %s "$p" 2>/dev/null || echo 0
            elif [ -d "$p" ]; then
              printf 'dir'
            else
              printf 'absent'
            fi
          }

          apply_part_diff() {
            local part="$1"
            local gapps_dir="gapps_${part}_raw"
            local vanilla_dir="vanilla_${part}_raw"
            [ -d "$gapps_dir" ] || { echo "SKIP $part: no gapps dir"; return 0; }
            [ -d "$vanilla_dir" ] || { echo "SKIP $part: no vanilla dir"; return 0; }

            local log="diff_${part}.log"
            : > "$log"
            {
              echo "# part=${part}"
              echo "# columns: action  rel_path  old_bytes  new_bytes"
            } >> "$log"

            echo "=== Diff $part ==="
            build_manifest "$gapps_dir"   "manifest_g_${part}.tsv"
            build_manifest "$vanilla_dir" "manifest_v_${part}.tsv"

            awk -F'\t' '
              NR==FNR { v[$2]=1; next }
              ($1=="F"||$1=="L") && !($2 in v) { print $1"\t"$2 }
            ' "manifest_v_${part}.tsv" "manifest_g_${part}.tsv" > "only_g_${part}.tsv"

            awk -F'\t' '
              NR==FNR { g[$2]=1; next }
              ($1=="F"||$1=="L") && !($2 in g) { print $1"\t"$2 }
            ' "manifest_g_${part}.tsv" "manifest_v_${part}.tsv" > "only_v_${part}.tsv"

            awk -F'\t' '
              NR==FNR { gh[$2]=$3; gt[$2]=$1; next }
              ($1=="F") && (($2 in gh)) && (gt[$2]=="F") && (gh[$2] != $3) { print "F\t"$2 }
            ' "manifest_g_${part}.tsv" "manifest_v_${part}.tsv" > "diff_${part}.tsv"

            echo "  only_in_gapps:   $(wc -l < only_g_${part}.tsv)"
            echo "  only_in_vanilla: $(wc -l < only_v_${part}.tsv)"
            echo "  differ:          $(wc -l < diff_${part}.tsv)"

            local removed_bytes=0 added_bytes=0 replaced_bytes_old=0 replaced_bytes_new=0
            local n_removed=0 n_added=0 n_replaced=0

            while IFS=$'\t' read -r t rel; do
              [ -z "$rel" ] && continue
              if is_protected "$rel"; then
                printf 'KEEP_PROTECTED\t%s\t%s\t-\n' "$rel" "$(size_of "$gapps_dir/$rel")" >> "$log"
                continue
              fi
              local old=$(size_of "$gapps_dir/$rel")
              [ "$old" = "link" ] || [ "$old" = "dir" ] && old=0
              removed_bytes=$((removed_bytes + old)); n_removed=$((n_removed + 1))
              printf 'REMOVED\t%s\t%s\t0\n' "$rel" "$old" >> "$log"
              rm -f "$gapps_dir/$rel"
            done < "only_g_${part}.tsv"

            while IFS=$'\t' read -r t rel; do
              [ -z "$rel" ] && continue
              local src="$vanilla_dir/$rel" dst="$gapps_dir/$rel"
              local new=$(size_of "$src")
              [ "$new" = "link" ] || [ "$new" = "dir" ] && new=0
              if is_apex_path "$rel"; then
                materialize_apex "$src" "$dst" || true
              else
                copy_preserve_xattr "$src" "$dst" || true
              fi
              added_bytes=$((added_bytes + new)); n_added=$((n_added + 1))
              printf 'ADDED\t%s\t0\t%s\n' "$rel" "$new" >> "$log"
            done < "only_v_${part}.tsv"

            while IFS=$'\t' read -r t rel; do
              [ -z "$rel" ] && continue
              if is_protected "$rel"; then
                printf 'KEEP_PROTECTED_DIFF\t%s\t%s\t%s\n' \
                  "$rel" "$(size_of "$gapps_dir/$rel")" "$(size_of "$vanilla_dir/$rel")" >> "$log"
                continue
              fi
              local old=$(size_of "$gapps_dir/$rel")
              [ "$old" = "link" ] || [ "$old" = "dir" ] && old=0
              local new=$(size_of "$vanilla_dir/$rel")
              [ "$new" = "link" ] || [ "$new" = "dir" ] && new=0
              case "$rel" in
                *framework-res.apk|framework-res.apk)
                  printf 'WARN_FRAMEWORK_RES\t%s\t%s\t%s\n' "$rel" "$old" "$new" >> "$log"
                  ;;
              esac
              local src="$vanilla_dir/$rel" dst="$gapps_dir/$rel"
              if is_apex_path "$rel"; then
                materialize_apex "$src" "$dst" || true
              else
                copy_preserve_xattr "$src" "$dst" || true
              fi
              replaced_bytes_old=$((replaced_bytes_old + old))
              replaced_bytes_new=$((replaced_bytes_new + new))
              n_replaced=$((n_replaced + 1))
              printf 'REPLACED\t%s\t%s\t%s\n' "$rel" "$old" "$new" >> "$log"
            done < "diff_${part}.tsv"

            {
              echo ""
              echo "## summary ${part}"
              echo "removed_count=${n_removed} removed_bytes=${removed_bytes}"
              echo "added_count=${n_added} added_bytes=${added_bytes}"
              echo "replaced_count=${n_replaced} replaced_bytes_old=${replaced_bytes_old} replaced_bytes_new=${replaced_bytes_new}"
            } | tee -a "$log"

            {
              echo ""
              echo "## bytes by top-level dir (removed / added / replaced_new)"
              awk -F'\t' '
                $1=="REMOVED"  { d=$2; sub(/\/.*/,"",d); r[d]+=$3 }
                $1=="ADDED"    { d=$2; sub(/\/.*/,"",d); a[d]+=$4 }
                $1=="REPLACED" { d=$2; sub(/\/.*/,"",d); p[d]+=$4 }
                END {
                  for (k in r) keys[k]=1
                  for (k in a) keys[k]=1
                  for (k in p) keys[k]=1
                  for (k in keys)
                    printf "%s\tremoved=%d\tadded=%d\treplaced_new=%d\n", k, r[k], a[k], p[k]
                }
              ' "diff_${part}.log" | sort -k2,2nr
            } | tee -a "$log"

            echo "  detail log -> $log"
          }

          for part in system system_ext product; do
            apply_part_diff "$part"
          done

          echo ""
          echo "=== DIFF SUMMARY (all parts) ==="
          for part in system system_ext product; do
            [ -f "diff_${part}.log" ] || continue
            grep -E '^(removed_|added_|replaced_)' "diff_${part}.log" | sed "s/^/${part}: /" || true
          done

          echo "=== Diff applied ==="

      - name: Print diff report (stdout)
        if: always()
        run: |
          set -euo pipefail
          cd "$WORK_ROOT/work"
          echo "############ DIFF SUMMARY (stdout) ############"
          for part in system system_ext product; do
            [ -f "diff_${part}.log" ] || { echo "${part}: no log"; continue; }
            echo ""
            echo "########## ${part} ##########"
            grep -E '^## summary|^(removed_|added_|replaced_)' "diff_${part}.log" || true
            echo ""
            echo "--- top 15 REMOVED by size ---"
            awk -F'\t' '$1=="REMOVED"{print $3"\t"$2}' "diff_${part}.log" \
              | sort -k1,1nr | head -15 || true
            echo ""
            echo "--- top 15 ADDED by size ---"
            awk -F'\t' '$1=="ADDED"{print $4"\t"$2}' "diff_${part}.log" \
              | sort -k1,1nr | head -15 || true
            echo ""
            echo "--- top 15 REPLACED by delta ---"
            awk -F'\t' '$1=="REPLACED"{print ($4-$3)"\t"$2"\t"$3"\t"$4}' "diff_${part}.log" \
              | sort -k1,1nr | head -15 || true
            echo ""
            echo "--- bytes by top-level dir ---"
            sed -n '/^## bytes by top-level dir/,$p' "diff_${part}.log" | head -40 || true
          done
          echo "############ END DIFF SUMMARY ############"

      - name: Detect original UUIDs and filesystem parameters
        run: |
          set -e
          cd "$WORK_ROOT/work"

          for part in system system_ext product; do
            img=$(find "$WORK_ROOT/gapps/extracted" -maxdepth 2 -name "${part}.img" 2>/dev/null | head -1)
            if [ -n "$img" ] && [ -f "$img" ]; then
              if dump.erofs -s "$img" >/dev/null 2>&1; then
                UUID=$(dump.erofs -s "$img" 2>/dev/null | grep -oP 'UUID:\s*\K[0-9a-f-]+' | head -1 || true)
                echo "${part}: EROFS, UUID=${UUID:-unknown}"
                echo "$UUID" > "${part}_uuid.txt"
                echo "erofs" > "${part}_format.txt"
              elif blkid -o value -s UUID "$img" >/dev/null 2>&1; then
                UUID=$(blkid -o value -s UUID "$img" 2>/dev/null || true)
                echo "${part}: ext4, UUID=${UUID:-unknown}"
                echo "$UUID" > "${part}_uuid.txt"
                echo "ext4" > "${part}_format.txt"
              elif simg2img "$img" "${img}.raw" >/dev/null 2>&1; then
                if dump.erofs -s "${img}.raw" >/dev/null 2>&1; then
                  UUID=$(dump.erofs -s "${img}.raw" 2>/dev/null | grep -oP 'UUID:\s*\K[0-9a-f-]+' | head -1 || true)
                  echo "${part}: sparse EROFS, UUID=${UUID:-unknown}"
                  echo "$UUID" > "${part}_uuid.txt"
                  echo "erofs" > "${part}_format.txt"
                elif blkid -o value -s UUID "${img}.raw" >/dev/null 2>&1; then
                  UUID=$(blkid -o value -s UUID "${img}.raw" 2>/dev/null || true)
                  echo "${part}: sparse ext4, UUID=${UUID:-unknown}"
                  echo "$UUID" > "${part}_uuid.txt"
                  echo "ext4" > "${part}_format.txt"
                fi
              else
                echo "${part}: unknown format"
                echo "" > "${part}_uuid.txt"
                echo "erofs" > "${part}_format.txt"
              fi
            else
              echo "WARNING: GApps ${part}.img not found"
              echo "" > "${part}_uuid.txt"
              echo "erofs" > "${part}_format.txt"
            fi
          done

          echo "=== Detected ==="
          for part in system system_ext product; do
            echo "${part}: format=$(cat ${part}_format.txt) uuid=$(cat ${part}_uuid.txt)"
          done

      - name: Detect EROFS parameters from original images
        run: |
          set -e
          cd "$WORK_ROOT/work"

          detect_erofs_params() {
            local img="$1"
            local opts=""
            local ftype=$(file -b "$img" 2>/dev/null)
            local comp=""
            if echo "$ftype" | grep -qi "LZ4"; then
              comp="lz4"
            elif echo "$ftype" | grep -qi "LZMA"; then
              comp="lzma"
            elif echo "$ftype" | grep -qi "DEFLATE"; then
              comp="deflate"
            elif echo "$ftype" | grep -qi "ZSTD"; then
              comp="zstd"
            fi

            local dump=""
            if command -v dump.erofs >/dev/null 2>&1; then
              dump=$(dump.erofs -s "$img" 2>/dev/null || true)
            fi

            local blocksize=4096
            local pcluster=65536
            local comp_level=""
            local extra=""

            if [ -n "$dump" ]; then
              local blk_log2=$(echo "$dump" | grep -oP 'blkszbits[^\d]*\K\d+' | head -1)
              if [ -z "$blk_log2" ]; then
                blk_log2=$(echo "$dump" | grep -oP 'blocksize[^\d]*\K\d+' | head -1)
              fi
              if [ -n "$blk_log2" ]; then
                if [ "$blk_log2" -le 16 ] 2>/dev/null; then
                  blocksize=$((1 << blk_log2))
                else
                  blocksize=$blk_log2
                fi
              fi

              local pc=$(echo "$dump" | grep -oP 'pclusterblks[^\d]*\K\d+' | head -1)
              if [ -n "$pc" ]; then
                pcluster=$((pc * blocksize))
              else
                pc=$(echo "$dump" | grep -oP 'physical.cluster[^\d]*\K\d+' | head -1)
                if [ -n "$pc" ]; then
                  pcluster=$pc
                fi
              fi

              local lvl=$(echo "$dump" | grep -oP 'compress[._ ]?level[^\d]*\K\d+' | head -1)
              if [ -n "$lvl" ]; then
                comp_level=",level=$lvl"
              fi

              if echo "$dump" | grep -qi "FRAGMENTS"; then
                extra="$extra -Efragments"
              fi
              if echo "$dump" | grep -qi "DEDUPE"; then
                extra="$extra -Ededupe"
              fi
              if echo "$dump" | grep -qi "ZERO_PADDING\|LZ4_0PADDING"; then
                extra="$extra -E0padding"
              fi
            fi

            [ -z "$blocksize" ] && blocksize=4096
            [ -z "$pcluster" ] && pcluster=65536
            [ -z "$comp" ] && comp="lz4hc"

            opts="-z$comp$comp_level -b$blocksize"
            if [ "$pcluster" != "4096" ]; then
              opts="$opts -C$pcluster"
            fi
            opts="$opts $extra"
            opts=$(echo "$opts" | xargs)
            echo "$opts"
          }

          for part in system system_ext product; do
            img=$(find "$WORK_ROOT/gapps/extracted" -maxdepth 2 -name "${part}.img" 2>/dev/null | head -1)
            if [ -n "$img" ] && [ -f "$img" ]; then
              opts=$(detect_erofs_params "$img")
              echo "EROFS params for ${part}: $opts"
              echo "$opts" > "${part}_erofs_params.txt"
            else
              echo "-zlz4hc -b4096 -C65536" > "${part}_erofs_params.txt"
            fi
          done

      - name: Rebuild images preserving format, UUID and SELinux
        run: |
          set -e
          cd "$WORK_ROOT/work"

          build_erofs() {
            local raw="$1"
            local out="$2"
            local uuid="$3"
            local params_file="$4"
            local opts=$(cat "$params_file" 2>/dev/null || echo "-zlz4hc -b4096 -C65536")
            echo "  EROFS params: $opts"
            if [ -n "$uuid" ]; then
              mkfs.erofs $opts -U "$uuid" "$out" "$raw"
            else
              mkfs.erofs $opts "$out" "$raw"
            fi
          }

          build_ext4() {
            local raw="$1"
            local out="$2"
            local uuid="$3"
            local orig_img="$4"

            local size=$(du -sb "$raw" | awk '{print $1}')
            size=$((size + size / 10 + 16*1024*1024))
            truncate -s "$size" "$out"

            if [ -n "$uuid" ]; then
              mkfs.ext4 -F -U "$uuid" -d "$raw" "$out"
            else
              mkfs.ext4 -F -d "$raw" "$out"
            fi

            if [ -f "$orig_img" ] && file -b "$orig_img" | grep -qi "Android sparse"; then
              img2simg "$out" "${out}.sparse"
              mv "${out}.sparse" "$out"
            fi
          }

          for part in system system_ext product; do
            raw="gapps_${part}_raw"
            fmt=$(cat "${part}_format.txt" 2>/dev/null || echo "erofs")
            uuid=$(cat "${part}_uuid.txt" 2>/dev/null || echo "")
            params_file="${part}_erofs_params.txt"
            orig_img=$(find "$WORK_ROOT/gapps/extracted" -maxdepth 2 -name "${part}.img" 2>/dev/null | head -1)

            if [ ! -d "$raw" ]; then
              echo "WARNING: $raw not found, skipping $part"
              continue
            fi

            echo "=== Building ${part} (format=$fmt, uuid=$uuid) ==="
            if [ "$fmt" = "ext4" ]; then
              build_ext4 "$raw" "${part}.img" "$uuid" "$orig_img"
            else
              build_erofs "$raw" "${part}.img" "$uuid" "$params_file"
            fi

            file "${part}.img"
            ls -lh "${part}.img"
          done

      - name: Log rebuilt image sizes (after)
        run: |
          set -e
          cd "$WORK_ROOT/work"

          echo "=== Rebuilt .img sizes (after modification) ===" | tee sizes_after.txt
          for part in system system_ext product; do
            if [ -f "${part}.img" ]; then
              RAW=$(stat -c %s "${part}.img")
              PACKED=$(du -sh "${part}.img" | awk '{print $1}')
              FMT=$(cat "${part}_format.txt" 2>/dev/null || echo '?')
              UUID=$(cat "${part}_uuid.txt" 2>/dev/null || echo '-')
              SPARSE=$(file -b "${part}.img" | grep -qi "Android sparse" && echo "yes" || echo "no")
              printf '%-11s %12s bytes  du=%s  fmt=%s  uuid=%s  sparse=%s\n' \
                "$part" "$RAW" "$PACKED" "$FMT" "$UUID" "$SPARSE" | tee -a sizes_after.txt
            else
              printf '%-11s MISSING\n' "$part" | tee -a sizes_after.txt
            fi
          done

          echo "" | tee -a sizes_after.txt
          echo "=== Delta per part ===" | tee -a sizes_after.txt
          for part in system system_ext product; do
            before=$(grep -E "^gapps +${part} " sizes_before.txt 2>/dev/null | awk '{print $3}' | head -1)
            after=$(stat -c %s "${part}.img" 2>/dev/null || echo 0)
            if [ -n "$before" ] && [ "$before" != "MISSING" ] && [ "$after" -gt 0 ]; then
              delta=$((after - before))
              pct=$(awk -v b="$before" -v d="$delta" 'BEGIN{ if(b>0) printf "%+.2f%%", d*100/b; else print "-" }')
              printf '%-11s before=%-12s after=%-12s delta=%s (%s)\n' \
                "$part" "$before" "$after" "$delta" "$pct" | tee -a sizes_after.txt
            fi
          done

      - name: Create recovery flashable ZIP
        run: |
          set -e
          cd "$WORK_ROOT/work"
          mkdir -p zip/META-INF/com/google/android

          cp system.img zip/system.img
          cp system_ext.img zip/system_ext.img
          cp product.img zip/product.img

          cat > zip/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3

          ui_print() {
            echo "ui_print $1" >&$OUTFD
            echo "ui_print" >&$OUTFD
          }

          set_progress() {
            echo "set_progress $1" >&$OUTFD
          }

          flash_image() {
            local img="$1"
            local part="$2"
            if [ ! -f "$img" ]; then
              ui_print "WARNING: $img not found, skipping $part"
              return
            fi
            ui_print "Flashing $part from $img"
            dd if="$img" of="/dev/block/by-name/$part" bs=1M 2>/dev/null || \
              dd if="$img" of="/dev/block/bootdevice/by-name/$part" bs=1M 2>/dev/null || \
              ui_print "ERROR: failed to flash $part"
          }

          ui_print "=== Convert GApps to Vanilla ==="
          ui_print "Flashing system, system_ext, product"

          set_progress 0.1
          flash_image "system.img" "system"
          set_progress 0.4
          flash_image "system_ext.img" "system_ext"
          set_progress 0.7
          flash_image "product.img" "product"
          set_progress 1.0

          ui_print "=== Done ==="
          ui_print "Reboot to system"
          EOF
          chmod +x zip/META-INF/com/google/android/update-binary

          cat > zip/META-INF/com/google/android/updater-script <<'EOF'
          package_extract_file("system.img", "/tmp/system.img");
          package_extract_file("system_ext.img", "/tmp/system_ext.img");
          package_extract_file("product.img", "/tmp/product.img");
          run_program("/sbin/sh", "/tmp/update-binary", "3", "1", "/tmp/updater-script");
          EOF

          cd zip
          zip -r -9 "../${CN}-convert-to-vanilla.zip" . -x "*.git*"
          cd ..
          ls -lh "${CN}-convert-to-vanilla.zip"

          Z=$(stat -c %s "${CN}-convert-to-vanilla.zip")
          echo "ZIP size: $Z bytes"
          if [ "$Z" -ge 2147483648 ]; then
            echo "ZIP >= 2 GiB: splitting into 1900m parts and removing oversized original"
            rm -f "${CN}-convert-to-vanilla-split".*
            mv "${CN}-convert-to-vanilla.zip" "${CN}-convert-to-vanilla-oversized.zip"
            zip -r -9 -s 1900m "${CN}-convert-to-vanilla-split.zip" zip -x "*.git*" >/dev/null
            rm -f "${CN}-convert-to-vanilla-oversized.zip"
            ls -lh "${CN}-convert-to-vanilla-split".*
          fi

          for f in system.img system_ext.img product.img; do
            [ -f "$f" ] && mv "$f" "${CN}-$f" 2>/dev/null || true
          done
          ls -lh

      - name: Upload device artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-images-${{ matrix.codename }}
          path: |
            /mnt/work/work/${{ matrix.codename }}-system.img
            /mnt/work/work/${{ matrix.codename }}-system_ext.img
            /mnt/work/work/${{ matrix.codename }}-product.img
            /mnt/work/work/${{ matrix.codename }}-convert-to-vanilla.zip
            /mnt/work/work/${{ matrix.codename }}-convert-to-vanilla-split.zip
            /mnt/work/work/${{ matrix.codename }}-convert-to-vanilla-split.z*
          retention-days: 7

      - name: Upload diff logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-logs-${{ matrix.codename }}
          path: |
            /mnt/work/work/diff_*.log
            /mnt/work/work/manifest_g_*.tsv
            /mnt/work/work/manifest_v_*.tsv
            /mnt/work/work/only_g_*.tsv
            /mnt/work/work/only_v_*.tsv
            /mnt/work/work/diff_*.tsv
            /mnt/work/work/*_format.txt
            /mnt/work/work/*_uuid.txt
            /mnt/work/work/*_erofs_params.txt
            /mnt/work/work/sizes_before.txt
            /mnt/work/work/sizes_after.txt
          retention-days: 7

  # ============================================================
  # JOB 3: PUBLISH
  # Collects per-device artifacts and updates single "sync" release.
  # Incremental: uploads only new/updated assets, keeps old ones.
  # Merges manifest.json with existing one.
  # ============================================================
  publish:
    name: Publish sync release
    needs: [setup, discover, convert]
    if: |
      !inputs.dry_run
      && always()
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download per-device artifacts
        if: needs.discover.outputs.has_jobs == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: vanilla-images-*
          path: all
          merge-multiple: false

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: report
          path: report

      - name: Download existing sync manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p existing
          if gh release view "$SYNC_TAG" --repo "$REPO" &>/dev/null; then
            gh release view "$SYNC_TAG" --repo "$REPO" --json assets \
              -q '.assets[].name' > existing/assets.txt
            if grep -qx 'manifest.json' existing/assets.txt; then
              gh release download "$SYNC_TAG" --repo "$REPO" \
                --pattern 'manifest.json' --dir existing
            fi
          fi

      - name: Build merged manifest.json
        run: |
          set -euo pipefail
          mkdir -p publish
          python3 - <<'PY'
          import json, os, glob
          from datetime import datetime, timezone

          matrix = json.load(open("report/matrix.json")) if os.path.isfile("report/matrix.json") else []
          old = {}
          if os.path.isfile("existing/manifest.json"):
              old = json.load(open("existing/manifest.json")).get("devices", {})

          touched = {}
          for item in matrix:
              cn = item["codename"]
              pattern = f"all/vanilla-images-{cn}/{cn}-*"
              files = sorted(glob.glob(pattern))
              assets = [os.path.basename(f) for f in files if os.path.isfile(f)]
              touched[cn] = {
                  "codename": cn,
                  "devicemodel": item["devicemodel"],
                  "branch": item["branch"],
                  "version": item["version"],
                  "gapps_filename": item["gapps_filename"],
                  "gapps_md5": item.get("gapps_md5", ""),
                  "gapps_timestamp": item["gapps_timestamp"],
                  "vanilla_filename": item.get("vanilla_filename", ""),
                  "vanilla_timestamp": item.get("vanilla_timestamp", 0),
                  "donor_codename": item.get("donor_codename", ""),
                  "donor_devicemodel": item.get("donor_devicemodel", ""),
                  "donor_level": item.get("donor_level", 0),
                  "assets": assets,
                  "built_at": datetime.now(timezone.utc).isoformat(),
                  "build_status": "ok",
              }

          merged = dict(old)
          merged.update(touched)

          manifest = {
              "schema": 1,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "devices": merged,
          }
          json.dump(manifest, open("publish/manifest.json", "w"), indent=2, ensure_ascii=False)
          print(f"Manifest: {len(merged)} total, {len(touched)} touched this run")
          PY

      - name: Build release_body.md
        run: |
          set -euo pipefail
          {
            echo "## Project Infinity-X — Vanilla sync"
            echo ""
            echo "**Updated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Total devices:** $(jq '.devices | length' publish/manifest.json)"
            echo "**Touched this run:** $(jq 'length' report/matrix.json)"
            echo ""
            echo "### All devices in this release"
            echo ""
            echo "| # | Model | Codename | Version | GApps file | Donor | Level |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.devices | to_entries[] | [.value.devicemodel, .value.codename, .value.version, .value.gapps_filename, (.value.donor_codename // "-"), (.value.donor_level // 0)] | @tsv' publish/manifest.json \
              | sort -t$'\t' -k2 \
              | awk -F'\t' '{i++; printf "| %d | %s | `%s` | %s | `%s` | %s | %s |\n", i, $1, $2, $3, $4, ($5 == "" ? "-" : "`" $5 "`"), ($6 == "0" ? "-" : $6)}'
            echo ""
            echo "### New/updated in this run"
            echo ""
            echo "| # | Model | Codename | Version | Donor | Level | Reason |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.[] | [.devicemodel, .codename, .version, (.donor_codename // "-"), (.donor_level // 0), .reason] | @tsv' report/matrix.json \
              | awk -F'\t' '{i++; printf "| %d | %s | `%s` | %s | %s | %s | %s |\n", i, $1, $2, $3, ($4 == "" ? "-" : "`" $4 "`"), ($5 == "0" ? "-" : $5), $6}'
          } > publish/release_body.md
          cat publish/release_body.md

      - name: Create sync release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$SYNC_TAG" --repo "$REPO" &>/dev/null; then
            echo "Creating release '$SYNC_TAG'"
            gh release create "$SYNC_TAG" \
              --repo "$REPO" \
              --title "Project Infinity-X — Vanilla sync" \
              --notes-file publish/release_body.md
          fi

      - name: Upload new/updated assets with --clobber
        if: needs.discover.outputs.has_jobs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in all/vanilla-images-*/*; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$SYNC_TAG" "$f" --clobber --repo "$REPO"
          done

      - name: Upload updated manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$SYNC_TAG" publish/manifest.json --clobber --repo "$REPO"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$SYNC_TAG" \
            --repo "$REPO" \
            --notes-file publish/release_body.md

      - name: Prune stale assets
        if: ${{ inputs.prune_stale }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          STALE=$(jq -r '.[]' report/stale.json 2>/dev/null || echo "")
          if [ -z "$STALE" ]; then
            echo "No stale devices"
            exit 0
          fi
          gh release view "$SYNC_TAG" --repo "$REPO" --json assets -q '.assets[].name' > all_assets.txt
          for cn in $STALE; do
            echo "Pruning: $cn"
            grep -E "^${cn}-" all_assets.txt | while read -r asset; do
              gh release delete-asset "$SYNC_TAG" "$asset" --repo "$REPO" --yes || true
            done
          done

      - name: Write summary
        run: |
          {
            echo "## Sync complete"
            echo ""
            echo "**Total in release:** $(jq '.devices | length' publish/manifest.json)"
            echo "**Touched this run:** $(jq 'length' report/matrix.json)"
            echo ""
            echo "### New/updated"
            jq -r '.[] | "- \(.devicemodel) (`\(.codename)`) v\(.version) — donor: \(.donor_codename // "self") (level \(.donor_level // 0)) — \(.reason)"' report/matrix.json
          } >> $GITHUB_STEP_SUMMARY
